<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .icon {
      width: 24px;
      height: 24px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .status.connected {
      background-color: #d1fae5;
      color: #065f46;
    }

    .status.disconnected {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .button.primary {
      background-color: #3b82f6;
      color: white;
    }

    .button.primary:hover {
      background-color: #2563eb;
    }

    .button.secondary {
      background-color: #e5e7eb;
      color: #374151;
      margin-top: 8px;
    }

    .button.secondary:hover {
      background-color: #d1d5db;
    }

    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="icons/icon48.png" alt="DoulGet" class="icon">
    <h1>DoulGet</h1>
  </div>

  <div id="status" class="status">
    __MSG_statusChecking__
  </div>

  <button id="openApp" class="button primary" style="display: none;">
    __MSG_openApp__
  </button>

  <button id="testDownload" class="button secondary" style="display: none;">
    __MSG_testDetection__
  </button>

  <button id="detectCurrentPage" class="button secondary" style="display: none; margin-top: 8px;">
    __MSG_detectPage__
  </button>

  <div class="info">
    __MSG_extensionInfo__
  </div>

  <script src="popup.js"></script>
</body>

</html>
